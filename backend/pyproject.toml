[tool.poetry]
name = "finance-couple-app"
version = "1.0.0"
description = "App financeiro para casal"
authors = ["Você"]
packages = [
    { include = "finance_couple_app" },
    { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.109.2"
uvicorn = "0.27.1"
sqlalchemy = "2.0.51"
psycopg2-binary = "2.9.12"
pydantic = "2.13.4"
pydantic-extra-types = "2.10.1"
pydantic-settings = "2.6.1"
python-jose = { version = "3.5.0", extras = ["cryptography"] }
passlib = { version = "1.7.4", extras = ["bcrypt"] }
python-multipart = "0.0.9"
python-dotenv = "1.2.2"
websockets = "12.0"
bcrypt = "4.0.1"
email-validator = "2.3.0"   # ✅ LINHA ADICIONADA - RESOLVE TUDO

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamentos - SyncUS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-logo">
            <span>SyncUS</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html" class="sidebar-item">📊 Dashboard</a></li>
            <li><a href="transactions.html" class="sidebar-item active">💰 Lançamentos</a></li>
            <li><a href="history.html" class="sidebar-item">📜 Histórico</a></li>
            <li><a href="reports.html" class="sidebar-item">📈 Relatórios</a></li>
            <li><a href="settings.html" class="sidebar-item">⚙️ Configurações</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="#" onclick="logout()" class="sidebar-item">🚪 Sair</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="page-header">
            <h1 class="page-title">Novo Lançamento</h1>
        </header>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <form id="transactionForm">
                <div class="form-group">
                    <label>Tipo de Lançamento</label>
                    <div style="display: flex; gap: 20px; margin-top: 10px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="type" value="entrada" checked style="width: auto;"> 🟢 Entrada
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="type" value="saida" style="width: auto;"> 🔴 Saída
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="amount">Valor (R$)</label>
                    <input type="number" id="amount" step="0.01" required placeholder="0,00">
                </div>

                <div class="form-group">
                    <label for="description">Descrição</label>
                    <input type="text" id="description" required placeholder="Ex: Salário, Supermercado...">
                </div>

                <div class="form-group">
                    <label for="category">Categoria</label>
                    <select id="category" required>
                        <option value="">Selecione...</option>
                        <option value="1">Alimentação</option>
                        <option value="2">Moradia</option>
                        <option value="3">Transporte</option>
                        <option value="4">Lazer</option>
                        <option value="5">Saúde</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Data</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label>Quem pagou/recebeu?</label>
                    <select id="paid_by" required>
                        <option value="user1">Você</option>
                        <option value="user2">Ela/Ele</option>
                        <option value="both">Ambos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Divisão do valor</label>
                    <select id="split_type" required>
                        <option value="50/50">50/50 (Padrão)</option>
                        <option value="100_user1">100% Você</option>
                        <option value="100_user2">100% Ela/Ele</option>
                        <option value="custom">Personalizado</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success" style="width: 100%; justify-content: center; margin-top: 20px;">💾 SALVAR LANÇAMENTO</button>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            document.getElementById('date').valueAsDate = new Date();
        });

        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                amount: parseFloat(document.getElementById('amount').value),
                description: document.getElementById('description').value,
                category_id: parseInt(document.getElementById('category').value),
                type: document.querySelector('input[name="type"]:checked').value,
                date: new Date(document.getElementById('date').value).toISOString(),
                paid_by: document.getElementById('paid_by').value,
                split_type: document.getElementById('split_type').value
            };

            const response = await fetch(`${API_URL}/transactions/`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showToast('Lançamento salvo com sucesso!', 'success');
                document.getElementById('transactionForm').reset();
                document.getElementById('date').valueAsDate = new Date();
            } else {
                const error = await response.json();
                showToast(error.detail || 'Erro ao salvar', 'danger');
            }
        });
    </script>
</body>
</html>

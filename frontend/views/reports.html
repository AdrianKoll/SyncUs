<div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="titulo-pagina mb-1"><i class="bi bi-bar-chart-line text-primary me-2"></i>Relatórios</h1><p class="subtitulo-pagina">Analise os gastos e exporte os dados financeiros do casal</p></div></div>

<div class="card p-4 mb-4"><div class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label small">Mês / Ano</label><input type="month" id="relatorioPeriodo" class="form-control"></div><div class="col-md-3"><label class="form-label small">Quem pagou</label><select id="filtroQuem" class="form-select"><option value="ambos">Todos</option><option value="eu">Você</option><option value="parceira">Parceiro(a)</option></select></div><div class="col-md-3"><label class="form-label small">Formato</label><select id="formatoRelatorio" class="form-select"><option value="csv">CSV</option><option value="txt">TXT</option><option value="json">JSON</option></select></div><div class="col-md-3"><button id="gerarRelatorioBtn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill"><i class="bi bi-file-earmark-arrow-down me-2"></i>Gerar relatório</button></div></div></div>

<div class="row g-4 mb-4"><div class="col-md-3"><div class="card-resumo card-azul"><div class="icone"><i class="bi bi-wallet2"></i></div><div class="label">Saldo Final</div><div id="relatorioSaldo" class="valor">Carregando...</div></div></div><div class="col-md-3"><div class="card-resumo card-verde"><div class="icone"><i class="bi bi-arrow-down"></i></div><div class="label">Total Entradas</div><div id="relatorioEntradas" class="valor text-success">Carregando...</div></div></div><div class="col-md-3"><div class="card-resumo card-vermelho"><div class="icone"><i class="bi bi-arrow-up"></i></div><div class="label">Total Saídas</div><div id="relatorioSaidas" class="valor text-danger">Carregando...</div></div></div><div class="col-md-3"><div class="card-resumo card-roxo"><div class="icone"><i class="bi bi-basket"></i></div><div class="label">Transações</div><div id="relatorioQuantidade" class="valor" style="color:#A78BFA">Carregando...</div></div></div></div>

<div class="row g-4 mb-4"><div class="col-md-6"><div class="card p-4 h-100"><h5 class="fw-bold mb-3"><i class="bi bi-pie-chart text-primary me-2"></i>Gastos por categoria</h5><div style="height:260px"><canvas id="grafCatRel"></canvas></div></div></div><div class="col-md-6"><div class="card p-4 h-100"><h5 class="fw-bold mb-3"><i class="bi bi-bar-chart text-primary me-2"></i>Evolução diária</h5><div style="height:260px"><canvas id="grafMesRel"></canvas></div></div></div></div>

<div class="row g-4"><div class="col-md-6"><div class="card p-4 h-100"><h5 class="fw-bold mb-3"><i class="bi bi-scale text-primary me-2"></i>Distribuição por pagador</h5><div style="height:220px"><canvas id="grafQuemRel"></canvas></div></div></div><div class="col-md-6"><div class="card p-4 h-100"><h5 class="fw-bold mb-3"><i class="bi bi-stars text-primary me-2"></i>Resumo do período</h5><ul id="resumoRelatorio" class="list-unstyled small lh-lg"><li class="text-secondary">Carregando dados...</li></ul></div></div></div>

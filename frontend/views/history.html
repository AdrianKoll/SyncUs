<div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4"><div><h1 class="titulo-pagina mb-1"><i class="bi bi-clock-history text-primary me-2"></i>Histórico</h1><p class="subtitulo-pagina">Consulte todos os lançamentos registrados pelo casal</p></div><button id="exportarHistorico" class="btn btn-outline-success rounded-pill"><i class="bi bi-filetype-csv me-2"></i>Exportar CSV</button></div>

<div class="card p-4 mb-4"><div class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label small">Data inicial</label><input type="date" id="historicoInicio" class="form-control"></div><div class="col-md-3"><label class="form-label small">Data final</label><input type="date" id="historicoFim" class="form-control"></div><div class="col-md-2"><label class="form-label small">Tipo</label><select id="historicoTipo" class="form-select"><option value="">Todos</option><option value="entrada">Entradas</option><option value="saida">Saídas</option></select></div><div class="col-md-2"><label class="form-label small">Categoria</label><select id="historicoCategoria" class="form-select"><option value="">Todas</option></select></div><div class="col-md-2"><button id="aplicarHistorico" class="btn btn-primary w-100 rounded-pill"><i class="bi bi-funnel me-2"></i>Filtrar</button></div></div></div>

<div class="card p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="fw-bold mb-0">Lançamentos encontrados</h5><span id="historicoContador" class="text-secondary small"></span></div><div class="table-responsive"><table class="table table-dark table-borderless align-middle"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Pago por</th><th class="text-end">Valor</th></tr></thead><tbody id="tabelaHistorico"><tr><td colspan="6" class="text-center text-secondary py-5">Carregando histórico...</td></tr></tbody></table></div></div>

<script>
var historicoTransacoes = [];
var historicoCategorias = [];

async function inicializarHistorico() {
    const inicio = document.getElementById('historicoInicio');
    const fim = document.getElementById('historicoFim');
    if (!inicio || !fim) return;
    const tokenDaView = window.__syncusViewToken;

    if (!inicio.dataset.bound) {
        const now = new Date();
        inicio.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
        fim.value = toInputDate(now);
        document.getElementById('aplicarHistorico')?.addEventListener('click', () => carregarHistorico(tokenDaView));
        document.getElementById('exportarHistorico')?.addEventListener('click', exportarHistorico);
        inicio.dataset.bound = 'true';
    }

    await carregarCategoriasHistorico(tokenDaView);
    if (tokenDaView !== window.__syncusViewToken) return;
    await carregarHistorico(tokenDaView);
}

async function carregarCategoriasHistorico(tokenDaView = window.__syncusViewToken) {
    try {
        historicoCategorias = await apiRequest('/transactions/categories');
        if (tokenDaView !== window.__syncusViewToken) return;
        const select = document.getElementById('historicoCategoria');
        if (select) select.innerHTML = '<option value="">Todas</option>' + historicoCategorias.map(category => `<option value="${category.id}">${escapeHtml(category.name)}</option>`).join('');
    } catch (error) {
        console.warn('Categorias do histórico indisponíveis:', error);
    }
}

async function carregarHistorico(tokenDaView = window.__syncusViewToken) {
    const inicioElement = document.getElementById('historicoInicio');
    const fimElement = document.getElementById('historicoFim');
    const tipoElement = document.getElementById('historicoTipo');
    const categoriaElement = document.getElementById('historicoCategoria');
    if (![inicioElement, fimElement, tipoElement, categoriaElement].every(Boolean)) return;
    const params = new URLSearchParams({ limit: '500' });
    const inicio = inicioElement.value;
    const fim = fimElement.value;
    const tipo = tipoElement.value;
    const categoria = categoriaElement.value;
    if (inicio) params.set('start_date', toApiDate(inicio));
    if (fim) {
        const nextDay = new Date(`${fim}T00:00:00`);
        nextDay.setDate(nextDay.getDate() + 1);
        params.set('end_date', toApiDate(toInputDate(nextDay)));
    }
    if (tipo) params.set('type', tipo);
    if (categoria) params.set('category_id', categoria);

    try {
        historicoTransacoes = await apiRequest(`/transactions/?${params.toString()}`);
        if (tokenDaView !== window.__syncusViewToken || !document.getElementById('tabelaHistorico')) return;
        renderizarHistorico();
    } catch (error) {
        if (tokenDaView !== window.__syncusViewToken) return;
        historicoTransacoes = [];
        const tabela = document.getElementById('tabelaHistorico');
        if (tabela) tabela.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-5">${escapeHtml(handleApiError(error, 'Erro ao carregar histórico.'))}</td></tr>`;
    }
}

function renderizarHistorico() {
    const tabela = document.getElementById('tabelaHistorico');
    const contador = document.getElementById('historicoContador');
    if (!tabela || !contador) return;
    contador.textContent = `${historicoTransacoes.length} lançamento(s)`;
    if (!historicoTransacoes.length) {
        tabela.innerHTML = '<tr><td colspan="6" class="text-center text-secondary py-5">Nenhum lançamento encontrado para os filtros selecionados.</td></tr>';
        return;
    }
    tabela.innerHTML = historicoTransacoes.map(transaction => `<tr><td class="text-secondary small">${formatDate(transaction.date)}</td><td>${escapeHtml(transaction.description)}</td><td>${escapeHtml(transaction.category?.name || 'Outros')}</td><td><span class="badge ${transaction.type === 'entrada' ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">${transaction.type === 'entrada' ? 'Entrada' : 'Saída'}</span></td><td>${formatarPagador(transaction, true)}</td><td class="text-end ${transaction.type === 'entrada' ? 'tag-positiva' : 'tag-negativa'}">${transaction.type === 'entrada' ? '+' : '-'} ${formatCurrency(transaction.amount)}</td></tr>`).join('');
}

function exportarHistorico() {
    if (!historicoTransacoes.length) return showToast('Não há dados para exportar.', 'warning');
    const rows = [['Data', 'Descrição', 'Categoria', 'Tipo', 'Pago por', 'Valor'], ...historicoTransacoes.map(transaction => [formatDate(transaction.date), transaction.description, transaction.category?.name || 'Outros', transaction.type, formatarPagador(transaction), transaction.amount])];
    const csv = rows.map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(';')).join('\n');
    downloadTextFile(`syncus-historico-${toInputDate()}.csv`, '\ufeff' + csv, 'text/csv;charset=utf-8');
}
</script>

<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncUS | Financeiro para Casal</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <!-- Nosso CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =============================================
         ✅ TOP BAR (FIXA, NUNCA MUDA)
         ============================================= -->
    <header class="topbar">
        <div class="d-flex align-items-center gap-3">
            <button class="btn-menu" id="btnMenu" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a href="#/dashboard" class="logo">
                <span>SyncUS</span>
            </a>
        </div>

        <div class="d-flex align-items-center gap-4">
            <!-- 🔔 SININHO COM CONTADOR -->
            <div class="dropdown">
                <button class="btn-icon position-relative" id="btnSininho" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-regular fa-bell fa-lg"></i>
                    <span class="badge-contador" id="contadorNotif" style="display:none">0</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end p-0 caixa-notif" id="listaNotif">
                    <li class="p-3 border-bottom d-flex justify-content-between align-items-center">
                        <strong class="small">🔔 Notificações</strong>
                        <button class="btn btn-link p-0 text-decoration-none small" id="marcarTodasLidas">Marcar todas</button>
                    </li>
                    <li class="p-4 text-center text-secondary small notif-vazia">Carregando...</li>
                </ul>
            </div>

            <!-- 👤 PERFIL COM NOME VISÍVEL -->
            <div class="dropdown">
                <button class="perfil-topbar d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="perfil-foto" id="perfilFoto">AK</div>
                    <div class="d-none d-md-block text-start lh-1">
                        <div class="text-muted small">Olá,</div>
                        <strong class="text-white" id="perfilNome">Usuário</strong>
                    </div>
                    <i class="fa-solid fa-chevron-down text-muted small"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end p-0 caixa-perfil">
                    <li class="p-3 border-bottom">
                        <strong id="gavetaNome" class="d-block">Usuário</strong>
                        <small class="text-secondary" id="gavetaEmail">email@email.com</small>
                    </li>
                    <li><a class="dropdown-item" href="#/settings" onclick="navegar('settings')"><i class="fa-regular fa-user me-2"></i>Meu Perfil</a></li>
                    <li><a class="dropdown-item" href="#/settings" onclick="navegar('settings')"><i class="fa-solid fa-gear me-2"></i>Configurações</a></li>
                    <li><hr class="dropdown-divider my-0"></li>
                    <li><a class="dropdown-item text-danger" href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Sair</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="app-wrapper">
        <!-- =============================================
             ✅ SIDEBAR (FIXA, NUNCA MUDA)
             ============================================= -->
        <nav class="sidebar" id="sidebar">
            <ul class="nav flex-column gap-1 p-3">
                <li class="nav-item">
                    <a class="nav-link rota" data-view="dashboard" href="#/dashboard">
                        <i class="fa-solid fa-chart-pie me-3"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rota" data-view="transactions" href="#/transactions">
                        <i class="fa-solid fa-right-left me-3"></i>Lançamentos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rota" data-view="history" href="#/history">
                        <i class="fa-solid fa-clock-rotate-left me-3"></i>Histórico
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rota" data-view="reports" href="#/reports">
                        <i class="fa-solid fa-chart-line me-3"></i>Relatórios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rota" data-view="settings" href="#/settings">
                        <i class="fa-solid fa-gear me-3"></i>Configurações
                    </a>
                </li>
            </ul>
        </nav>

        <!-- =============================================
             ✅ CONTEÚDO (A ÚNICA COISA QUE MUDA)
             ============================================= -->
        <main class="conteudo" id="app"></main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nossos JS (ORDEM IMPORTA!) -->
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>

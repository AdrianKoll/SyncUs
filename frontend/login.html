<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SyncUS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="sidebar-logo" style="padding: 0 0 30px; justify-content: center;">
                <span>SyncUS</span>
            </div>
            <h2 style="margin-bottom: 20px; text-align: center;">Entrar</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">ENTRAR</button>
            </form>
            <p style="margin-top: 20px; text-align: center; color: var(--text-secondary);">
                Não tem uma conta? <a href="register.html" style="color: var(--accent-blue); text-decoration: none;">Cadastre-se</a>
            </p>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const formData = new FormData();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    window.location.href = 'dashboard.html';
                } else {
                    const error = await response.json();
                    showToast(error.detail || 'Erro ao entrar', 'danger');
                }
            } catch (err) {
                showToast('Erro de conexão com o servidor', 'danger');
            }
        });
    </script>
</body>
</html>

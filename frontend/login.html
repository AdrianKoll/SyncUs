<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | SyncUS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo">SyncUS</span>
        </div>

        <h1 class="auth-titulo">Bem-vindo(a) de volta</h1>
        <p class="auth-subtitulo">Entre para gerenciar as finanças do casal</p>

        <div class="auth-erro" id="erroLogin"></div>

        <form id="formLogin">
            <!-- E-MAIL -->
            <div class="mb-3">
                <label class="form-label small">
                    <i class="fa-regular fa-envelope me-1 text-secondary"></i>E-mail
                </label>
                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="fa-regular fa-envelope text-secondary"></i>
                    </span>
                    <input 
                        type="email" 
                        name="email" 
                        class="form-control border-start-0" 
                        placeholder="voce@email.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <!-- SENHA -->
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small mb-0">
                        <i class="fa-solid fa-lock me-1 text-secondary"></i>Senha
                    </label>
                    <a href="#" class="small text-decoration-none">Esqueceu?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="fa-solid fa-lock text-secondary"></i>
                    </span>
                    <input 
                        type="password" 
                        name="password" 
                        id="senhaLogin" 
                        class="form-control border-start-0 border-end-0" 
                        placeholder="••••••••" 
                        required 
                        minlength="6"
                    >
                    </button>
                </div>
            </div>

            <!-- LEMBRAR-ME -->
            <div class="mb-4">
                <label class="form-check-label small">
                    <input type="checkbox" class="form-check-input" checked> Manter conectado
                </label>
            </div>

            <!-- BOTÃO ENTRAR -->
            <button type="submit" class="btn-auth btn text-white w-100">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
            </button>
        </form>

        <div class="auth-divisor">ou</div>

        <p class="auth-link text-center">
            Não tem conta? <a href="register.html">Cadastre-se grátis</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Se já estiver logado, vai direto pro app
        if (getStoredToken()) {
            window.location.href = 'index.html#/dashboard';
        }

        // Enviar formulário de login
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const erro = document.getElementById('erroLogin');
            erro.style.display = 'none';

            const form = new FormData(e.target);
            const email = form.get('email');
            const senha = form.get('password');

            try {
                // ✅ Backend FastAPI OAuth2: form-data (username + password)
                const corpo = new URLSearchParams();
                corpo.append('username', email);
                corpo.append('password', senha);

                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: corpo.toString()
                });

                const dados = await res.json();

                if (!res.ok) {
                    const msg = dados.detail
                        ? (Array.isArray(dados.detail) 
                            ? dados.detail.map(x => x.msg).join(', ') 
                            : dados.detail)
                        : 'E-mail ou senha incorretos';
                    throw new Error(msg);
                }

                const token = dados.access_token || dados.token;
                if (!token) throw new Error('Backend não retornou token de acesso');

                // Salva token e entra no app conforme a escolha de sessão
                const lembrar = e.target.querySelector('input[type="checkbox"]')?.checked ?? true;
                storeAuthToken(token, lembrar);
                showToast('✅ Login efetuado com sucesso!', 'success');

                setTimeout(() => {
                    window.location.href = 'index.html#/dashboard';
                }, 400);

            } catch (err) {
                console.error('💥 Erro no login:', err);
                erro.textContent = `❌ ${err.message}`;
                erro.style.display = 'block';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar | SyncUS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo">SyncUS</span>
        </div>

        <h1 class="auth-titulo">Crie sua conta</h1>
        <p class="auth-subtitulo">Comece a organizar as finanças do casal juntos</p>

        <div class="auth-erro" id="erroRegistro"></div>

        <form id="formRegistro">
            <!-- NOME -->
            <div class="mb-3">
                <label class="form-label small">
                    <i class="bi bi-person me-1 text-secondary"></i>Nome completo
                </label>
                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="bi bi-person text-secondary"></i>
                    </span>
                    <input 
                        type="text" 
                        name="nome" 
                        class="form-control border-start-0" 
                        placeholder="Seu nome" 
                        required 
                        minlength="2"
                        autocomplete="name"
                    >
                </div>
            </div>

            <!-- E-MAIL -->
            <div class="mb-3">
                <label class="form-label small">
                    <i class="bi bi-envelope me-1 text-secondary"></i>E-mail
                </label>
                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="bi bi-envelope text-secondary"></i>
                    </span>
                    <input 
                        type="email" 
                        name="email" 
                        class="form-control border-start-0" 
                        placeholder="voce@email.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <!-- SENHA -->
            <div class="mb-3">
                <label class="form-label small mb-1">
                    <i class="bi bi-lock me-1 text-secondary"></i>Senha (mínimo 6 caracteres)
                </label>
                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="bi bi-lock text-secondary"></i>
                    </span>
                    <input 
                        type="password" 
                        name="password" 
                        id="senhaRegistro" 
                        class="form-control border-start-0 border-end-0" 
                        placeholder="••••••••" 
                        required 
                        minlength="6"
                    >
                    </button>
                </div>
            </div>

            <!-- CONFIRMAR SENHA → SEM OLHO, SEM BOTÃO -->
            <div class="mb-4">
                <label class="form-label small mb-1">
                    <i class="bi bi-lock me-1 text-secondary"></i>Confirmar senha
                </label>
                <div class="input-group">
                    <span class="input-group-text border-end-0">
                        <i class="bi bi-lock text-secondary"></i>
                    </span>
                    <input 
                        type="password" 
                        id="confirmaSenha" 
                        class="form-control border-start-0" 
                        placeholder="Repita a senha" 
                        required 
                        minlength="6"
                    >
                    <!-- NENHUM BOTÃO AQUI → sem olho duplicado -->
                </div>
            </div>

            <!-- BOTÃO CADASTRAR -->
            <button type="submit" class="btn-auth btn text-white w-100">
                <i class="bi bi-person-plus me-2"></i>Criar conta grátis
            </button>
        </form>

        <div class="auth-divisor">ou</div>

        <p class="auth-link text-center">
            Já tem conta? <a href="login.html">Entre aqui</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const erro = document.getElementById('erroRegistro');
            erro.style.display = 'none';

            const form = new FormData(e.target);
            const nome = form.get('nome').trim();
            const email = form.get('email').trim();
            const senha = form.get('password');
            const confirmaSenha = document.getElementById('confirmaSenha').value;

            // Validação frontend
            if (senha !== confirmaSenha) {
                erro.textContent = '❌ As senhas não coincidem';
                erro.style.display = 'block';
                return;
            }

            try {
                // ✅ Ajuste os campos aqui se seu backend for diferente
                const corpo = {
                    name: nome,
                    email: email,
                    password: senha
                    // se precisar de username separado: username: email
                };

                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(corpo)
                });

                const dados = await res.json();

                if (!res.ok) {
                    const msg = dados.detail
                        ? (Array.isArray(dados.detail) 
                            ? dados.detail.map(x => x.msg).join(', ') 
                            : dados.detail)
                        : 'Não foi possível criar a conta';
                    throw new Error(msg);
                }

                showToast('✅ Conta criada! Agora é só entrar', 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html?email=' + encodeURIComponent(email);
                }, 500);

            } catch (err) {
                console.error('💥 Erro no registro:', err);
                erro.textContent = `❌ ${err.message}`;
                erro.style.display = 'block';
            }
        });

        // Preenche email se vier da página de login
        const params = new URLSearchParams(window.location.search);
        const emailParam = params.get('email');
        if (emailParam) {
            document.querySelector('input[name="email"]').value = emailParam;
        }
    </script>
</body>
</html>

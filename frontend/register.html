<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SyncUS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="sidebar-logo" style="padding: 0 0 30px; justify-content: center;">
                <span>SyncUS</span>
            </div>
            <h2 style="margin-bottom: 20px; text-align: center;">Criar Conta</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" required placeholder="Seu Nome">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirmar Senha</label>
                    <input type="password" id="confirm_password" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%; justify-content: center; margin-top: 10px;">CADASTRAR</button>
            </form>
            <p style="margin-top: 20px; text-align: center; color: var(--text-secondary);">
                Já tem uma conta? <a href="login.html" style="color: var(--accent-blue); text-decoration: none;">Entre aqui</a>
            </p>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            
            if (password !== confirm) {
                return showToast('As senhas não coincidem', 'danger');
            }

            try {
                const response = await fetch('http://localhost:8000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                if (response.ok) {
                    showToast('Conta criada com sucesso!', 'success');
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    const error = await response.json();
                    showToast(error.detail || 'Erro ao cadastrar', 'danger');
                }
            } catch (err) {
                showToast('Erro de conexão', 'danger');
            }
        });
    </script>
</body>
</html>

name: syncus-finance-casal

services:
  db:
    image: postgres:15-alpine
    container_name: db-couple-finance
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: casal123
      POSTGRES_DB: finance_casal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-couple
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@casal.com
      PGADMIN_DEFAULT_PASSWORD: casal123
    ports:
      - "5050:80"
    depends_on:
      - db

  api:
    build: ./backend
    container_name: api-couple-finance
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://admin:casal123@db:5432/finance_casal
      SECRET_KEY: chave-secreta-super-segura-do-casal-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    volumes:
      - ./backend:/app

volumes:
  postgres_data: